{% extends 'base.html' %}
{% load static %}

{% block title %}Recipe Book{% endblock %}

{% block content %}
<header>
    <h1>Recipe Book</h1>

    {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}">Login</a>
    {% endif %}
</header>
{% endblock %}
