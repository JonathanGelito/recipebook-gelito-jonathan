

{% extends 'ledger/base_ledger.html' %}
{% load static %}


{% block title %}Recipes


{% endblock %}

{% block content %}
{{ block.super }}
<ul>

{% for recipe in object_list %}
    <li>
        <a href="{% url 'ledger:recipe' pk=recipe.pk %}">
        {{ recipe.name }}
        </a>
    </li>
{% endfor %}
    <a href="{% url 'ledger:recipeadd' %}">
        Add Recipe
    </a>

</ul>
{% endblock %}
